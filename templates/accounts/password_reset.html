{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block content %}
{% include "partials/_page_header.html" with title="Recuperar senha" icon="bi-envelope-fill" %}
<div class="card card-body" style="max-width:520px">
  <p class="text-muted">Informe seu email para receber o link de redefinicao.</p>
  <form method="post">{% csrf_token %}{{ form|crispy }}
    <button type="submit" class="btn btn-primary">Enviar</button>
  </form>
</div>
{% endblock %}
