<dialog id="sectionNotesDialog" class="sn-dialog" aria-labelledby="snTitle" data-api="{% url 'core:section_notes' %}" data-status-url="{% url 'core:section_note_status' 0 %}" data-user="{{ user }}">
  <header class="sn-dialog-head"><div><span class="sn-eyebrow">SECTION FOLLOW-UP</span><h2 id="snTitle">Comments</h2></div><button type="button" class="sn-button" data-sn-close aria-label="Close comments"><i class="bi bi-x-lg" aria-hidden="true"></i></button></header>
  <nav class="sn-tabs" aria-label="Section comments"><button type="button" class="sn-button" data-sn-tab="new">Add comment</button><button type="button" class="sn-button" data-sn-tab="history">History</button></nav>
  <p class="sn-message" data-sn-message role="status" aria-live="polite"></p>
  <form data-sn-form>
    {% csrf_token %}
    <div class="sn-fields"><label>Note date<input type="date" name="date" required></label><label>Recorded by<input name="author" value="{{ user }}" readonly></label></div>
    <label class="sn-note-label">Note on the current situation<textarea name="body" rows="5" maxlength="4000" required placeholder="Describe the situation and what needs to be followed up."></textarea></label>
    <div class="sn-fields"><label>Expected completion<input type="date" name="due_date" required></label><label class="sn-check"><input type="checkbox" name="information_only">Information only — no due date</label></div>
    <p class="sn-help">New comments start as Pending. Every status change records the author, date and time.</p>
    <footer class="sn-footer"><button type="submit" class="sn-button sn-primary">Save comment</button></footer>
  </form>
  <div data-sn-history hidden>
    <div class="sn-history-tools"><label>Status <select data-sn-filter><option value="all">All</option><option value="pending">Pending</option><option value="resolved">Resolved</option><option value="cancelled">Cancelled</option></select></label><button type="button" class="sn-button" data-sn-refresh><i class="bi bi-arrow-clockwise" aria-hidden="true"></i> Refresh</button></div>
    <div data-sn-list></div>
    <footer class="sn-pagination"><button type="button" class="sn-button" data-sn-prev>Previous</button><span data-sn-page></span><button type="button" class="sn-button" data-sn-next>Next</button></footer>
  </div>
</dialog>
